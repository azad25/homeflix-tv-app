name: Build APK

on:
  push:
    branches: [v5]
    paths-ignore:
      - 'apk/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/*.apk apk/homeflix-tv-v5.apk
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: homeflix-tv-v5
          path: apk/homeflix-tv-v5.apk

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f apk/homeflix-tv-v5.apk
          git diff --cached --quiet && exit 0
          git commit -m "build: update homeflix-tv-v5.apk from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
